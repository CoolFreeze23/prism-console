# Builds the Prism Console Flatpak on every push and pull request; a version tag (v1.2.3) also publishes it
# as a GitHub release with install.sh, so people can install it with one command.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: console-ui-dist
          path: console-ui/dist
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: interface
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 libraries/libnbtplusplus
      - uses: actions/download-artifact@v8
        with:
          name: console-ui-dist
          path: console-ui/dist
      # Microsoft sign-in uses this project's own client ID, kept as a repository secret. Without it the
      # build still works, with Microsoft sign-in turned off.
      - name: Microsoft client ID
        env:
          MSA_CLIENT_ID: ${{ secrets.MSA_CLIENT_ID }}
        run: |
          sed -i "s/@MSA_CLIENT_ID@/${MSA_CLIENT_ID}/" flatpak/io.github.CoolFreeze23.PrismConsole.yml
          if [ -z "$MSA_CLIENT_ID" ]; then echo "::warning::MSA_CLIENT_ID is not set: this build has Microsoft sign-in turned off"; fi
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/io.github.CoolFreeze23.PrismConsole.yml
          bundle: prism-console.flatpak
          cache-key: flatpak-builder-${{ hashFiles('flatpak/*.yml') }}
          upload-artifact: true

  release:
    name: Release
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: prism-console*
          merge-multiple: true
      - name: Checksums
        run: sha256sum prism-console.flatpak > prism-console.flatpak.sha256
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            prism-console.flatpak
            prism-console.flatpak.sha256
            install.sh
          generate_release_notes: true
